name: GitHub CI

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.meta.outputs.release }}
      tag: ${{ steps.meta.outputs.tag }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        run: |
          release=false
          tag=''
          if [[ "$GITHUB_REPOSITORY" == urcus/suuless && "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            release=true
            tag="$GITHUB_REF_NAME"
          fi
          code=$(bash scripts/ci/android-version-code.sh "$tag")
          printf 'release=%s\ntag=%s\nversion_code=%s\n' "$release" "$tag" "$code" >> "$GITHUB_OUTPUT"

  api:
    needs: [security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v

  web:
    needs: [security]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE: ${{ github.workspace }}/test-results/ci.sqlite
      ALLOW_REGISTRATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.0'
          cache: npm
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - run: |
          node --check server/static/app.js
          bash scripts/ci/test-web.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-diagnostics
          path: |
            test-results/*.png
            test-results/server.log
          retention-days: 7

  android:
    needs: [metadata, api, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_USER_HOME: ${{ github.workspace }}/.android-user
      CI_PIPELINE_IID: ${{ github.run_number }}
      CI_COMMIT_TAG: ${{ needs.metadata.outputs.tag }}
      CI_COMMIT_REF_PROTECTED: ${{ needs.metadata.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci/install-android-sdk.sh
      - name: Build validation APKs
        if: needs.metadata.outputs.release != 'true'
        run: bash scripts/ci/build-android.sh
      - name: Build release assets with the stable debug key
        if: needs.metadata.outputs.release == 'true'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: bash scripts/ci/build-android.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks
          path: dist/android/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-*
          retention-days: 7

  container:
    needs: [api, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE_ARCH: ${{ matrix.arch }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and smoke-test the runtime image
        run: |
          docker build --platform "linux/$IMAGE_ARCH" -t suuless:ci \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          docker run --rm suuless:ci python -c "import platform; assert platform.machine() == {'amd64': 'x86_64', 'arm64': 'aarch64'}['$IMAGE_ARCH']; from tempfile import TemporaryDirectory; from server.app import create_app; temporary = TemporaryDirectory(); app = create_app({'DATABASE': temporary.name + '/probe.db'}); assert app.test_client().get('/healthz').status_code == 200"
          mkdir -p dist/image
          docker save suuless:ci | gzip > dist/image/image-${{ matrix.arch }}.tar.gz
      - run: python scripts/security/install-tool.py trivy
      - run: bash scripts/security/scan.sh image dist/image/image-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanned-image-${{ matrix.arch }}
          path: dist/image/image-${{ matrix.arch }}.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-image-${{ matrix.arch }}
          path: test-results/security/
          retention-days: 7

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scan: [python, npm, code, secrets, config]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.scan == 'npm'
        with:
          node-version: '24.11.0'
      - if: matrix.scan == 'python' || matrix.scan == 'code'
        run: pip install -r scripts/security/requirements.txt
      - if: matrix.scan == 'secrets'
        run: python scripts/security/install-tool.py gitleaks
      - if: matrix.scan == 'config'
        run: python scripts/security/install-tool.py trivy
      - name: Run security check
        env:
          SCAN: ${{ matrix.scan }}
        run: bash scripts/security/scan.sh "$SCAN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-${{ matrix.scan }}
          path: test-results/security/
          retention-days: 7

  publish:
    needs: [metadata, api, web, android, container, security]
    if: needs.metadata.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
      IMAGE: ghcr.io/urcus/suuless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apks
          path: dist/release
      - name: Check downloaded APK checksums
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS
      - name: Refuse to replace an already published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == env.RELEASE_TAG and .draft == false) | .tag_name')
          if [[ -n "$published" ]]; then
            echo 'Release already published; create a new version tag.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scanned-image-*
          merge-multiple: true
          path: dist/image
      - run: python scripts/security/install-tool.py crane
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: printf 'tag=%s:%s\n' "$IMAGE" "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Push scanned images and assemble the multi-platform index
        id: build
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: bash scripts/ci/push-multiarch-image.sh dist/image "$IMAGE_TAG"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Sign and verify the multi-platform index using GitHub OIDC
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          ref="$IMAGE@$IMAGE_DIGEST"
          identity="https://github.com/$GITHUB_WORKFLOW_REF"
          cosign sign --yes "$ref"
          cosign verify "$ref" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > dist/release/signature-verification.json
          printf '%s\n%s\n' "$IMAGE_TAG" "$ref" > dist/release/image-reference.txt
          printf '%s\n' "$identity" > dist/release/cosign-identity.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/ci/publish-github-release.sh
