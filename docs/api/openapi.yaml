components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session (web 24 hours, Android 30 days) or personal API token (365 days), not
        a JWT.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
      - error
    IssuedToken:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        token:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - id
      - token
      - expires_at
    Token:
      type: object
      properties:
        kind:
          type: string
          enum:
          - api
          - session
          - legacy
        client:
          type:
          - string
          - 'null'
          enum:
          - web
          - android
          - null
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: integer
          minimum: 1
        name:
          type: string
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
      required:
      - id
      - name
      - expires_at
      - current
    Timezone:
      type: object
      properties:
        id:
          type: string
        city:
          type: string
        countries:
          type: array
          items:
            type: string
        country_codes:
          type: array
          items:
            type: string
        label:
          type: string
        search:
          type: string
        utc_offset:
          type: string
        offset_seconds:
          type: integer
        legacy:
          type: boolean
      required:
      - id
      - city
      - countries
      - country_codes
      - label
      - search
      - utc_offset
      - offset_seconds
      - legacy
    Config:
      type: object
      properties:
        registration_enabled:
          type: boolean
        languages:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                - en
                - fr
                - ja
              name:
                type: string
            required:
            - code
            - name
        currencies:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
              digits:
                type: integer
                minimum: 0
            required:
            - code
            - name
            - digits
        timezones:
          type: array
          items:
            type: string
        timezone_options:
          type: array
          items:
            $ref: '#/components/schemas/Timezone'
        timezone_aliases:
          type: object
          additionalProperties:
            type: string
        timezone_offsets_at:
          type: string
          format: date-time
        tzdata_version:
          type: string
        email_required:
          type: boolean
      required:
      - registration_enabled
      - languages
      - currencies
      - timezones
      - timezone_options
      - timezone_aliases
      - timezone_offsets_at
      - tzdata_version
    Reminders:
      type: object
      properties:
        daily_enabled:
          type: boolean
        daily_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        weekly_enabled:
          type: boolean
        weekly_day:
          type: integer
          minimum: 0
          maximum: 6
        weekly_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        quiet_start:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        quiet_end:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      required:
      - daily_enabled
      - daily_time
      - weekly_enabled
      - weekly_day
      - weekly_time
      - quiet_start
      - quiet_end
    SettingsUpdate:
      type: object
      properties:
        pack_price:
          oneOf:
          - type: string
          - type: number
            minimum: 0
            maximum: 1000000
          description: Currency units, maximum 1,000,000; precision must match the currency. Prefer a
            decimal string.
        pack_price_cents:
          type: integer
          minimum: 0
          maximum: 100000000
          deprecated: true
        pack_size:
          type: integer
          minimum: 1
          maximum: 1000
        daily_target:
          type: integer
          minimum: 0
          maximum: 200
        currency:
          type: string
          description: Supported currency code from /api/config; changing it requires pack_price.
        language:
          type: string
          enum:
          - en
          - fr
          - ja
        timezone:
          type: string
          description: Valid IANA time-zone identifier.
      required: []
    Settings:
      type: object
      properties:
        pack_price:
          type: string
        pack_price_cents:
          type: integer
          minimum: 0
          maximum: 100000000
          deprecated: true
        pack_size:
          type: integer
          minimum: 1
          maximum: 1000
        daily_target:
          type: integer
          minimum: 0
          maximum: 200
        currency:
          type: string
          description: Supported currency code from /api/config; changing it requires pack_price.
        language:
          type: string
          enum:
          - en
          - fr
          - ja
        timezone:
          type: string
          description: Valid IANA time-zone identifier.
        timezone_info:
          $ref: '#/components/schemas/Timezone'
        reminders:
          $ref: '#/components/schemas/Reminders'
        coaching_goal:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 200
          - type: 'null'
        local_today:
          type: string
          format: date
        local_datetime:
          type: string
          format: date-time
      required:
      - pack_price
      - pack_price_cents
      - pack_size
      - daily_target
      - currency
      - language
      - timezone
      - timezone_info
      - reminders
      - coaching_goal
      - local_today
      - local_datetime
    Entry:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        occurred_at:
          type: string
          format: date-time
        local_datetime:
          type: string
          format: date-time
        quantity:
          type: integer
          minimum: 1
          maximum: 200
        cost:
          type: number
        currency:
          type: string
        source:
          type: string
          enum:
          - web
          - android
          - api
          - streamdeck
        trigger:
          type: string
          enum:
          - ''
          - coffee
          - stress
          - meal
          - social
          - boredom
          - other
      required:
      - id
      - occurred_at
      - local_datetime
      - quantity
      - cost
      - currency
      - source
      - trigger
    EntryCreate:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 200
          default: 1
        occurred_at:
          type: string
          format: date-time
        occurred_at_local:
          type: string
          description: Local ISO timestamp without offset, interpreted in the account time zone.
        source:
          type: string
          enum:
          - web
          - android
          - api
          - streamdeck
          default: api
        trigger:
          type: string
          enum:
          - ''
          - coffee
          - stress
          - meal
          - social
          - boredom
          - other
          default: ''
      required: []
      not:
        required:
        - occurred_at
        - occurred_at_local
    Totals:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 0
        costs:
          type: object
          additionalProperties:
            type: number
        cost:
          anyOf:
          - type: number
          - type: 'null'
        currency:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - quantity
      - costs
      - cost
      - currency
    Analysis:
      type: object
      properties:
        includes_today:
          type: boolean
        average_quantity_per_day:
          type: number
        average_cost_per_day:
          type: object
          additionalProperties:
            type: number
        days_with_entries:
          type: integer
          minimum: 0
        minimum_quantity:
          type: integer
          minimum: 0
        maximum_quantity:
          type: integer
          minimum: 0
        previous_period:
          type: object
          properties:
