openapi: 3.1.1
info:
  title: SuuLess API
  version: unreleased
  description: Contract for the current source tree. Account-scoped tracking, coaching and synchronization.
    JSON request bodies are limited to 16 KiB. Unknown object fields are generally ignored. Error messages
    are localized; use code for programmatic handling. HTML and static assets are outside this contract.
  license:
    name: MIT
    identifier: MIT
servers:
- url: /
  description: API origin; configure your deployment URL in your client.
security:
- bearerAuth: []
tags:
- name: Service
- name: Account
- name: Entries
- name: Coaching
- name: Synchronization
paths:
  /healthz:
    get:
      operationId: get_healthz
      tags:
      - Service
      summary: Check server and database health
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                required:
                - status
      security: []
  /api/config:
    get:
      operationId: get_api_config
      tags:
      - Service
      summary: Get public client configuration
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
      security: []
  /api/auth/register:
    post:
      operationId: post_api_auth_register
      tags:
      - Account
      summary: Register an account and issue a session (web 24h, Android 30 days)
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/IssuedToken'
                - type: object
                  properties:
                    activation_required:
                      const: true
                    message:
                      type: string
                  required:
                  - activation_required
                  - message
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  enum:
                  - web
                  - android
                  default: web
                  description: Declared client type; fixed expiry, not extended by activity. Not device
                    attestation.
                username:
                  type: string
                  pattern: ^[a-zA-Z0-9_.-]{3,40}$
                password:
                  type: string
                  minLength: 12
                  maxLength: 256
                language:
                  type: string
                  enum:
                  - en
                  - fr
                  - ja
                  default: en
                timezone:
                  type: string
                  default: Europe/Paris
                email: &id002
                  type: string
                  format: email
              required:
              - username
              - password
      security: []
      description: When SMTP is enabled, email is required and a pending account is created without a
        session. The user must follow the activation email before signing in. Existing accounts remain
        active.
  /api/auth/login:
    post:
      operationId: post_api_auth_login
      tags:
      - Account
      summary: Issue a session (web 24h, Android 30 days)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedToken'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  enum:
                  - web
                  - android
                  default: web
                  description: Declared client type; fixed expiry, not extended by activity. Not device
                    attestation.
                username:
                  type: string
                password:
                  type: string
                  maxLength: 256
              required:
              - username
              - password
      security: []
  /api/auth/logout:
    post:
      operationId: post_api_auth_logout
      tags:
      - Account
      summary: Revoke the current token
      responses:
        '204':
          description: Successful response
        '401':
          $ref: '#/components/responses/Error'
  /api/me:
    delete:
      operationId: delete_api_me
      tags:
      - Account
      summary: Permanently delete the authenticated account and its data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              - confirm
              properties:
                password:
                  type: string
                  maxLength: 256
                confirm:
                  type: boolean
                  const: true
      responses:
        '204':
          description: Account and related records deleted; all tokens revoked
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
    get:
      operationId: get_api_me
      tags:
      - Account
      summary: Get current account
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    minimum: 1
                  username:
                    type: string
                  role:
                    enum:
                    - admin
                    - user
                  language: &id001
                    type: string
                    enum:
                    - en
                    - fr
                    - ja
                  email:
                    type:
                    - string
                    - 'null'
                  email_verified:
                    type: boolean
                required:
                - id
                - username
        '401':
          $ref: '#/components/responses/Error'
  /api/sessions/others:
    delete:
      operationId: delete_api_sessions_others
      tags:
      - Account
      summary: Revoke other sessions, preserving current access and API keys
      description: Only explicitly typed sessions belonging to this account are revoked. Ambiguous legacy
        access is preserved.
      responses:
        '204':
          description: Other sessions revoked
        '401':
          $ref: '#/components/responses/Error'
  /api/tokens:
    get:
      operationId: get_api_tokens
      tags:
      - Account
      summary: List unexpired account keys and sessions
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Error'
    post:
      operationId: post_api_tokens
      tags:
      - Account
      summary: Create a 365-day API token
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedToken'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 60
                  default: Stream Deck
                  description: Whitespace is trimmed before validation.
              required: []
  /api/tokens/{token_id}:
    delete:
      operationId: delete_api_tokens_token_id
      tags:
      - Account
      summary: Revoke an account token
      responses:
        '204':
          description: Successful response
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
  /api/settings:
    get:
      operationId: get_api_settings
      tags:
      - Account
      summary: Get account settings
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Error'
    put:
      operationId: put_api_settings
      tags:
      - Account
      summary: Update supplied account settings
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
  /api/cigarettes:
    get:
      operationId: get_api_cigarettes
      tags:
      - Entries
      summary: List entries in a date range
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Entry'
                  total:
                    type: integer
                    minimum: 0
                required:
                - items
                - total
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
      parameters:
      - name: start
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 'Inclusive account-local date. Default: end=today, start=end minus 29 days. Range:
          1–366 days, from 2000 through today.'
      - name: end
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 'Inclusive account-local date. Default: end=today, start=end minus 29 days. Range:
          1–366 days, from 2000 through today.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 10000000
          default: 0
    post:
      operationId: post_api_cigarettes
      tags:
      - Entries
      summary: Record cigarettes
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryCreate'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.:-]{1,100}$
      description: An empty body records one cigarette now. Dates must be from 2000 through now. Explicit
        offset timestamps up to five seconds ahead are clamped to server receipt time. Local timestamps
        reject nonexistent DST times and choose the first repeated time. Reusing an account-scoped idempotency
        key returns the original entry, even if the body changes; deleting the entry releases its key.
  /api/cigarettes/{entry_id}:
    delete:
      operationId: delete_api_cigarettes_entry_id
      tags:
      - Entries
      summary: Delete an account entry
      responses:
        '204':
          description: Successful response
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
  /api/cigarettes/{entry_id}/context:
    patch:
      operationId: patch_api_cigarettes_entry_id_context
      tags:
      - Entries
      summary: Set the entry trigger
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  trigger:
                    type: string
                    enum:
                    - ''
                    - coffee
                    - stress
                    - meal
                    - social
                    - boredom
                    - other
                required:
                - trigger
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trigger:
                  type: string
                  enum:
                  - ''
                  - coffee
                  - stress
                  - meal
                  - social
                  - boredom
                  - other
                  default: ''
              required: []
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
  /api/stats:
    get:
      operationId: get_api_stats
      tags:
      - Entries
      summary: Get totals and period analysis
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
      parameters:
      - name: start
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 'Inclusive account-local date. Default: end=today, start=end minus 29 days. Range:
          1–366 days, from 2000 through today.'
      - name: end
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 'Inclusive account-local date. Default: end=today, start=end minus 29 days. Range:
          1–366 days, from 2000 through today.'
      description: Costs are grouped by currency. Scalar cost/currency are null for mixed totals. A zero
        comparison reference produces a null percentage. Projections use completed days only.
  /api/export.csv:
    get:
      operationId: get_api_export_csv
      tags:
      - Entries
      summary: Export entries as CSV
      responses:
        '200':
          description: Successful response
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
      parameters:
      - name: start
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 'Inclusive account-local date. Default: end=today, start=end minus 29 days. Range:
          1–366 days, from 2000 through today.'
      - name: end
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 'Inclusive account-local date. Default: end=today, start=end minus 29 days. Range:
          1–366 days, from 2000 through today.'
      description: 'UTF-8 with BOM. Columns: id,local_datetime,quantity,cost,currency,source. Attachment
        filename: suuless.csv.'
  /api/report.html:
    get:
      operationId: get_api_report_html
      tags:
      - Entries
      summary: Download a printable consumption report
      responses:
        '200':
          description: Successful response
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
      parameters:
      - name: start
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 'Inclusive account-local date. Default: end=today, start=end minus 29 days. Range:
          1–366 days, from 2000 through today.'
      - name: end
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 'Inclusive account-local date. Default: end=today, start=end minus 29 days. Range:
          1–366 days, from 2000 through today.'
      description: >-
        Self-contained, localized HTML attachment, printable to PDF in a browser.
        Includes daily recorded quantities, period totals, daily average and historical
        costs kept separate by currency. Empty days are labeled as missing entries,
        not confirmed abstinence. No account identifier or name is included.
        Language and time zone follow account preferences. Cache-Control is no-store.
  /api/sync/config:
    get:
      operationId: get_api_sync_config
      tags:
      - Synchronization
      summary: Discover direct synchronization
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  transport:
                    const: sse
                  path:
                    const: /api/sync/events
                required:
                - transport
                - path
        '401':
          $ref: '#/components/responses/Error'
  /api/sync/events:
    get:
      operationId: get_api_sync_events
      tags:
      - Synchronization
      summary: Stream account refresh notifications
      responses:
        '200':
          description: Successful response
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          description: Stream capacity reached
          headers:
            Retry-After:
              schema:
                type: string
              description: Retry delay in seconds (30).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[0-9a-f]{32}$
      description: 'Authenticated SSE stream. refresh events include an opaque revision id and empty JSON
        data {}; revoked terminates a revoked/expired session. Heartbeat comments occur every 10 seconds;
        streams end after about 60 seconds. Reconnect with Last-Event-ID and reload account data on refresh.
        A limit of 16 streams per worker reserves capacity for ordinary requests; saturation returns 503
        and Retry-After: 30.'
  /api/push:
    get:
      operationId: get_api_push
      tags:
      - Synchronization
      summary: Read legacy relay subscription
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Push'
        '401':
          $ref: '#/components/responses/Error'
      description: Legacy optional relay. Enabled only when both push server URLs are configured. Endpoints
        must belong to the configured public server; at most 16 subscriptions per account.
    put:
      operationId: put_api_push
      tags:
      - Synchronization
      summary: Register legacy relay endpoint
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Push'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
                  format: uri
              required:
              - endpoint
      description: Legacy optional relay. Enabled only when both push server URLs are configured. Endpoints
        must belong to the configured public server; at most 16 subscriptions per account.
    delete:
      operationId: delete_api_push
      tags:
      - Synchronization
      summary: Remove legacy relay subscription
      responses:
        '204':
          description: Successful response
        '401':
          $ref: '#/components/responses/Error'
      description: Legacy optional relay. Enabled only when both push server URLs are configured. Endpoints
        must belong to the configured public server; at most 16 subscriptions per account.
  /api/coaching:
    get:
      operationId: get_api_coaching
      tags:
      - Coaching
      summary: Get plan, progress and current craving
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coaching'
        '401':
          $ref: '#/components/responses/Error'
  /api/coaching/plan:
    put:
      operationId: put_api_coaching_plan
      tags:
      - Coaching
      summary: Update the versioned plan
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                    minimum: 0
                required:
                - version
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanUpdate'
      description: Supply the current version and changed fields only. Stale versions return 409 plan_conflict.
        Dates must be from 2000 onward; step dates must be distinct. Supplied steps replace the entire
        list. Enabled reminders inside quiet hours return 400 reminder_quiet_conflict. Times are account-local;
        Monday=0. Empty or null quit_date clears the date.
  /api/coaching/baseline:
    post:
      operationId: post_api_coaching_baseline
      tags:
      - Coaching
      summary: Freeze a historical baseline
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Baseline'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start:
                  type: string
                  format: date
                end:
                  type: string
                  format: date
              required:
              - start
              - end
      description: An immutable snapshot of 1–90 completed days from 2000 onward, with at least one cigarette.
        A second baseline returns 409 baseline_exists.
  /api/check-ins/{day}:
    put:
      operationId: put_api_check_ins_day
      tags:
      - Coaching
      summary: Confirm the expected daily total
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  quantity:
                    type: integer
                    minimum: 0
                  confirmed:
                    const: true
                required:
                - date
                - quantity
                - confirmed
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  minimum: 0
                  maximum: 1000000
              required:
              - quantity
      parameters:
      - name: day
        in: path
        required: true
        schema:
          type: string
          format: date
      description: Date from 2000 through today in the account time zone. A changed total returns 409
        checkin_conflict. Later entry additions/deletions invalidate affected confirmations.
    delete:
      operationId: delete_api_check_ins_day
      tags:
      - Coaching
      summary: Reopen a day in the current time zone
      responses:
        '204':
          description: Successful response
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
      parameters:
      - name: day
        in: path
        required: true
        schema:
          type: string
          format: date
  /api/cravings:
    post:
      operationId: post_api_cravings
      tags:
      - Coaching
      summary: Start a craving pause
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Craving'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '200':
          description: Existing craving
          content:
