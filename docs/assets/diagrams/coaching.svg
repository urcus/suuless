<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="craving-title craving-desc" id="coaching-root">
<title id="craving-title">Craving states in SuuLess</title>
<desc id="craving-desc">A pending craving can pass, end with a cigarette, or be cancelled. Only the smoked outcome adds a cigarette. Each final state is immutable.</desc>
<defs>
      <style>#coaching-root { color-scheme:light }
      #coaching-root { color: #2d3142; }
      #coaching-root code, #coaching-root pre { font-family:'Geist Mono',monospace;font-size:13px }
      #coaching-root pre { padding:20px;background:white;overflow:auto }
      #coaching-root a { color:#bf4520 }
      #coaching-root table { border-collapse:collapse;width:100% }
      #coaching-root th, #coaching-root td { text-align:left;vertical-align:top;border-bottom:1px solid #d6d8dd;padding:12px }
      #coaching-root table code { overflow-wrap:anywhere }
      #coaching-root .diagram-container { width:100%;overflow-x:auto;background:#fff;border:1px solid #d6d8dd }
      #coaching-root .node { fill:#f5f5f5;stroke:#4f5d75 }
      #coaching-root .name { font:600 12px Geist,Arial,sans-serif;fill:#2d3142 }
      #coaching-root .sub { font:9px 'Geist Mono',monospace;fill:#4f5d75 }
      #coaching-root .edge { fill:none;stroke:#4f5d75;stroke-width:1.5;marker-end:url(#coaching-craving-arrow) }
      #coaching-root .tag { font:8px 'Geist Mono',monospace;fill:#4f5d75 }
      #coaching-root .diagram-container { overflow-x:visible }
      #coaching-root th, #coaching-root td { padding:8px;font-size:13px }</style><marker id="coaching-craving-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/></marker></defs>
<text x="40" y="56" style="font:28px 'Instrument Serif',Georgia,serif;fill:#2d3142">The user chooses the outcome</text>
<text x="40" y="84" class="sub">One pending craving per account · three final outcomes</text>
<path class="edge" d="M320 300 H412 Q424 300 424 288 V180 Q424 168 436 168 H600"/>
<path class="edge" d="M320 300 H600"/>
<path class="edge" d="M320 300 H412 Q424 300 424 312 V420 Q424 432 436 432 H600"/>
<text x="460" y="156" class="tag">craving passed</text><text x="460" y="288" class="tag">cigarette smoked</text><text x="460" y="420" class="tag">pause cancelled</text>
<rect class="node" x="80" y="256" width="240" height="88" rx="12"/><text x="104" y="288" class="name">Pause in progress</text><text x="104" y="312" class="sub">pending · deadline in UTC</text>
<rect class="node" x="600" y="124" width="280" height="88" rx="12"/><text x="624" y="156" class="name">Passed</text><text x="624" y="180" class="sub">passed · success retained</text>
<rect x="600" y="256" width="280" height="88" rx="12" fill="#fff3ee" stroke="#bf4520"/><text x="624" y="288" class="name">Smoked</text><text x="624" y="312" class="sub">smoked · adds exactly +1</text>
<rect class="node" x="600" y="388" width="280" height="88" rx="12"/><text x="624" y="420" class="name">Cancelled</text><text x="624" y="444" class="sub">cancelled · no entry</text>
<text x="40" y="540" class="sub">One transaction: outcome + optional cigarette + check-in invalidation + SSE revision.</text>
<text x="40" y="564" class="sub">Repeating the outcome creates no duplicate; changing a final outcome returns HTTP 409.</text>
</svg>
