<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQLite to PostgreSQL migration</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#f5f5f5;color:#2d3142;font-family:Geist,Arial,sans-serif}main{max-width:1040px;min-width:0;margin:auto}h1{font:400 28px 'Instrument Serif',Georgia,serif}p{line-height:1.6;color:#4f5d75}.diagram-container{width:100%;overflow-x:auto}svg{display:block;width:100%;min-width:960px}.node{fill:#f5f5f5;stroke:#4f5d75}.focal{fill:#f7e9e2;stroke:#bf4520}.name{font:600 12px Geist,Arial,sans-serif;fill:#2d3142}.sub{font:9px 'Geist Mono',monospace;fill:#4f5d75}.label{font:8px 'Geist Mono',monospace;fill:#4f5d75}.wire{fill:none;stroke:#4f5d75;stroke-width:1.5;marker-end:url(#postgresql-migration-arrow)}@media print{body{padding:0}.diagram-container{overflow:visible}svg{min-width:0}}
</style></head><body><main>
<h1>SQLite to PostgreSQL</h1><p>Final migration: stop writes, preserve the source and verify the destination before switching.</p>
<div class="diagram-container"><svg viewBox="0 0 960 600" role="img" aria-labelledby="postgresql-migration-title postgresql-migration-desc">
<title id="postgresql-migration-title">Verified database migration</title>
<desc id="postgresql-migration-desc">After stopping writers and backing up SQLite, copy into an empty PostgreSQL database, verify all rows, then commit and restart or roll back.</desc>
<defs><marker id="postgresql-migration-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4f5d75"/></marker></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<path class="wire" d="M280 96V128"/><path class="wire" d="M280 192V224"/><path class="wire" d="M280 288V336"/><path class="wire" d="M400 384H600"/><path class="wire" d="M280 432V488"/><path class="wire" d="M740 416V456"/>
<rect x="472" y="360" width="56" height="16" fill="#f5f5f5"/><text class="label" x="500" y="371" text-anchor="middle">MATCH</text>
<rect x="296" y="448" width="88" height="16" fill="#f5f5f5"/><text class="label" x="340" y="459" text-anchor="middle">FAILURE</text>
<rect class="node" x="100" y="48" width="360" height="48" rx="20"/><text class="name" x="280" y="77" text-anchor="middle">Stop every SQLite writer</text>
<rect class="node" x="100" y="128" width="360" height="64" rx="6"/><text class="name" x="280" y="152" text-anchor="middle">Create and retain the final backup</text><text class="sub" x="280" y="176" text-anchor="middle">SQLite backup API · store outside the source volume</text>
<rect class="focal" x="100" y="224" width="360" height="64" rx="6"/><text class="name" x="280" y="248" text-anchor="middle">Migrate a private snapshot</text><text class="sub" x="280" y="272" text-anchor="middle">Empty PostgreSQL public schema · one transaction</text>
<path class="node" d="M280 336L400 384L280 432L160 384Z"/><text class="name" x="280" y="380" text-anchor="middle">Verify every table</text><text class="sub" x="280" y="400" text-anchor="middle">Counts + row fingerprints</text>
<rect class="focal" x="600" y="352" width="280" height="64" rx="6"/><text class="name" x="740" y="376" text-anchor="middle">Commit the verified target</text><text class="sub" x="740" y="400" text-anchor="middle">IDs and identity sequences preserved</text>
<rect class="node" x="600" y="456" width="280" height="64" rx="6"/><text class="name" x="740" y="480" text-anchor="middle">Restart and check the application</text><text class="sub" x="740" y="504" text-anchor="middle">DATABASE_URL selects PostgreSQL</text>
<rect class="node" x="100" y="488" width="360" height="48" rx="20"/><text class="name" x="280" y="508" text-anchor="middle">Roll back the target transaction</text><text class="sub" x="280" y="524" text-anchor="middle">Keep SQLite and diagnose before retrying</text>
<line x1="40" y1="556" x2="920" y2="556" stroke="#bfc0c0"/><text class="sub" x="40" y="580">Rehearsal: --dry-run verifies then rolls back. Final copy: --source-stopped confirms the maintenance window.</text>
</svg></div><p>The source is never modified. Once PostgreSQL receives new writes, switching back requires reconciliation; this tool does not reverse-migrate.</p></main></body></html>
