<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 688" role="img" aria-labelledby="push-sync-title push-sync-desc" id="push-sync-root"><title id="push-sync-title">Built-in widget synchronization</title><desc id="push-sync-desc">The web or API updates data and its revision in SQLite. The same backend notifies SuuLess Android directly, which reloads its counter.</desc><defs>
      <style>#push-sync-root { --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#eb6c36 }
      #push-sync-root { color: var(--ink); font-family: Geist,Arial,sans-serif; }
      #push-sync-root .diagram-container { width:100%;overflow-x:auto }
      #push-sync-root .name { font:600 16px Geist,Arial,sans-serif;fill:var(--ink) }
      #push-sync-root .sub { font:12px 'Geist Mono',monospace;fill:var(--muted) }
      #push-sync-root .node { fill:var(--paper);stroke:#bfc0c0 }
      #push-sync-root .focal { fill:#f7e9e2;stroke:var(--accent) }
      #push-sync-root .wire { fill:none;stroke:#4f5d75;stroke-width:1.5;marker-end:url(#architecture-arrow) }
      #push-sync-root .diagram-container { overflow:visible }
      #push-sync-root .life { stroke:#bfc0c0;stroke-dasharray:3,3 }
      #push-sync-root .label { font:11px Geist Mono,monospace;fill:#4f5d75 }</style><marker id="push-sync-push-sync-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4f5d75"/></marker></defs><line class="life" x1="120" y1="128" x2="120" y2="600"/><rect class="node" x="20" y="56" width="200" height="72" rx="6"/><text class="name" x="120" y="86" text-anchor="middle">Web / API</text><text class="sub" x="120" y="112" text-anchor="middle">Entry or settings</text><line class="life" x1="360" y1="128" x2="360" y2="600"/><rect class="node" x="260" y="56" width="200" height="72" rx="6"/><text class="name" x="360" y="86" text-anchor="middle">SuuLess</text><text class="sub" x="360" y="112" text-anchor="middle">HTTP + SSE stream</text><line class="life" x1="600" y1="128" x2="600" y2="600"/><rect class="node" x="500" y="56" width="200" height="72" rx="6"/><text class="name" x="600" y="86" text-anchor="middle">SQLite</text><text class="sub" x="600" y="112" text-anchor="middle">Data + revision</text><line class="life" x1="840" y1="128" x2="840" y2="600"/><rect class="node" x="740" y="56" width="200" height="72" rx="6"/><text class="name" x="840" y="86" text-anchor="middle">Android</text><text class="sub" x="840" y="112" text-anchor="middle">Service + widget</text><line x1="840" y1="176" x2="360" y2="176" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#push-sync-push-sync-arrow)"/><rect x="494.0" y="146" width="212" height="20" fill="#f5f5f5"/><text class="label" x="600.0" y="160" text-anchor="middle">AUTHENTICATED STREAM</text><line x1="120" y1="240" x2="360" y2="240" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#push-sync-push-sync-arrow)"/><rect x="134.0" y="210" width="212" height="20" fill="#f5f5f5"/><text class="label" x="240.0" y="224" text-anchor="middle">CHANGE</text><line x1="360" y1="304" x2="600" y2="304" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#push-sync-push-sync-arrow)"/><rect x="374.0" y="274" width="212" height="20" fill="#f5f5f5"/><text class="label" x="480.0" y="288" text-anchor="middle">ATOMIC COMMIT</text><line x1="600" y1="368" x2="360" y2="368" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#push-sync-push-sync-arrow)"/><rect x="374.0" y="338" width="212" height="20" fill="#f5f5f5"/><text class="label" x="480.0" y="352" text-anchor="middle">ACCOUNT REVISION</text><line x1="360" y1="432" x2="840" y2="432" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#push-sync-push-sync-arrow)"/><rect x="494.0" y="402" width="212" height="20" fill="#f5f5f5"/><text class="label" x="600.0" y="416" text-anchor="middle">REFRESH EVENT</text><line x1="840" y1="496" x2="360" y2="496" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#push-sync-push-sync-arrow)"/><rect x="494.0" y="466" width="212" height="20" fill="#f5f5f5"/><text class="label" x="600.0" y="480" text-anchor="middle">SETTINGS + STATISTICS</text><line x1="360" y1="560" x2="840" y2="560" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#push-sync-push-sync-arrow)"/><rect x="494.0" y="530" width="212" height="20" fill="#f5f5f5"/><text class="label" x="600.0" y="544" text-anchor="middle">COUNTER UPDATED</text><line x1="40" y1="624" x2="920" y2="624" stroke="#bfc0c0"/><text class="sub" x="48" y="652">Solid: request · dashed: response or signal · signals contain no consumption data.</text></svg>
