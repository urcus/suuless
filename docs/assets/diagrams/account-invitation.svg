<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="account-invitation-title account-invitation-desc">
<title id="account-invitation-title">SuuLess invitation and activation</title>
<desc id="account-invitation-desc">An authenticated administrator invites a recipient through the API and configured SMTP relay; accepting the single-use link creates an ordinary verified account.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#2d3142}.title{font-family:Georgia,serif;font-size:30px}.name{font-size:17px;font-weight:600}.note{font-size:15px;fill:#4f5d75}.label{font:13px monospace;fill:#4f5d75}.line{stroke:#4f5d75;stroke-width:1.5;fill:none;marker-end:url(#invitation-arrow)}.life{stroke:#a2a7b0;stroke-dasharray:4 4}.node{fill:#f5f5f5;stroke:#bfc0c0}</style><marker id="invitation-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#4f5d75"/></marker><marker id="invitation-open" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4f5d75"/></marker></defs>
<rect width="960" height="600" fill="#f5f5f5"/><text x="40" y="48" class="title">Invitation → verified account</text><text x="40" y="80" class="note">Authenticated administration · explicit recipient confirmation · single-use link</text>
<line x1="132" y1="180" x2="132" y2="512" class="life"/><rect x="40" y="112" width="184" height="68" rx="6" class="node"/><text x="132" y="140" text-anchor="middle" class="name">Administrator</text><text x="132" y="164" text-anchor="middle" class="note">Session + admin role</text>
<line x1="364" y1="180" x2="364" y2="512" class="life"/><rect x="272" y="112" width="184" height="68" rx="6" class="node"/><text x="364" y="140" text-anchor="middle" class="name">SuuLess API</text><text x="364" y="164" text-anchor="middle" class="note">SQLite transaction</text>
<line x1="596" y1="180" x2="596" y2="512" class="life"/><rect x="504" y="112" width="184" height="68" rx="6" class="node"/><text x="596" y="140" text-anchor="middle" class="name">SMTP relay</text><text x="596" y="164" text-anchor="middle" class="note">Configured server</text>
<line x1="828" y1="180" x2="828" y2="512" class="life"/><rect x="736" y="112" width="184" height="68" rx="6" class="node"/><text x="828" y="140" text-anchor="middle" class="name">Recipient</text><text x="828" y="164" text-anchor="middle" class="note">Browser + inbox</text>
<line x1="132" y1="224" x2="364" y2="224" class="line"/><rect x="176.0" y="192" width="144" height="24" fill="#f5f5f5"/><text x="248.0" y="210" text-anchor="middle" class="label">INVITE</text>
<line x1="364" y1="288" x2="596" y2="288" class="line"/><rect x="408.0" y="256" width="144" height="24" fill="#f5f5f5"/><text x="480.0" y="274" text-anchor="middle" class="label">SEND MAIL</text>
<line x1="596" y1="352" x2="828" y2="352" class="line" style="stroke-dasharray:5 4;marker-end:url(#invitation-open)"/><rect x="640.0" y="320" width="144" height="24" fill="#f5f5f5"/><text x="712.0" y="338" text-anchor="middle" class="label">DELIVER</text>
<line x1="828" y1="416" x2="364" y2="416" class="line"/><rect x="524.0" y="384" width="144" height="24" fill="#f5f5f5"/><text x="596.0" y="402" text-anchor="middle" class="label">ACCEPT LINK</text>
<line x1="364" y1="480" x2="828" y2="480" class="line" style="stroke-dasharray:5 4"/><rect x="524.0" y="448" width="144" height="24" fill="#f5f5f5"/><text x="596.0" y="466" text-anchor="middle" class="label">ACCOUNT READY</text>
<line x1="40" y1="536" x2="920" y2="536" stroke="#bfc0c0"/><text x="40" y="564" class="note">Invitation expires after 48 hours. Only its digest is stored in SQLite.</text><text x="40" y="588" class="note">Acceptance creates a verified user; the recipient then signs in normally.</text></svg>