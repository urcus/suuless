image: node:24.11.0-bookworm-slim

stages:
  - security
  - validate
  - build
  - image
  - sign
  - release

variables:
  DOCKER_CONFIG: "/kaniko/.docker"
  KANIKO_IMAGE: "gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  npm_config_audit: "false"
  npm_config_fund: "false"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_USER_HOME: "$CI_PROJECT_DIR/.android-user"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  tags:
    - k8s
  interruptible: true

.release-tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'

quality:api:
  stage: validate
  needs:
    - job: security
      artifacts: false
    - job: security:npm
      artifacts: false
  image: python:3.13-slim-bookworm
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: suuless_test
    POSTGRES_PASSWORD: synthetic-test-only
    POSTGRES_DB: suuless_test
    # Kubernetes executor: service containers share the job pod's network.
    TEST_POSTGRES_URL: postgresql://suuless_test:synthetic-test-only@127.0.0.1:5432/suuless_test
  cache:
    key:
      prefix: python-3.13
      files: [requirements.txt, requirements-dev.txt]
    paths: [.cache/pip/]
  script:
    - python --version
    - pip install -r requirements-dev.txt
    - python scripts/ci/wait-postgres.py
    - python -m unittest discover -s tests -v

quality:web:
  stage: validate
  needs:
    - job: security
      artifacts: false
    - job: security:npm
      artifacts: false
  cache:
    key:
      prefix: node-24
      files: [package-lock.json]
    paths: [.npm/]
  variables:
    DATABASE: "$CI_PROJECT_DIR/test-results/ci.sqlite"
    ALLOW_REGISTRATION: "true"
    BASE_URL: "http://127.0.0.1:8080"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 python3-venv ca-certificates
    - python3 -m venv .venv
    - .venv/bin/pip install -r requirements.txt
    - node --version && npm --version
    - npm ci --cache .npm --prefer-offline
    - npx playwright install --with-deps chromium
  script:
    - node --check server/static/app.js
    - bash scripts/ci/test-web.sh
  artifacts:
    when: always
    paths:
      - test-results/*.png
      - test-results/server.log
    expire_in: 1 week

android:build:
  stage: build
  image: eclipse-temurin:17-jdk-jammy
  needs:
    - job: quality:api
      artifacts: false
    - job: quality:web
      artifacts: false
  cache:
    key:
      prefix: android-sdk36-gradle8.13
      files:
        - android/gradle/wrapper/gradle-wrapper.properties
        - android/build.gradle
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
      - .android-sdk/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl unzip ca-certificates
    - bash scripts/ci/install-android-sdk.sh
  script:
    - bash scripts/ci/build-android.sh
  artifacts:
    when: always
    paths:
      - dist/android/
      - android/app/build/reports/lint-results-*.html
      - android/app/build/reports/lint-results-*.txt
    expire_in: 1 week

security:
  stage: security
  image: python:3.13-slim-bookworm
  needs: []
  parallel:
    matrix:
      - SCAN: [python, code, secrets, config]
  before_script:
    - |
      case "$SCAN" in
        python|code) pip install -r scripts/security/requirements.txt ;;
        secrets)
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          python scripts/security/install-tool.py gitleaks ;;
        config) python scripts/security/install-tool.py trivy ;;
      esac
  script:
    - bash scripts/security/scan.sh "$SCAN"
  artifacts:
    when: always
    paths: [test-results/security/]
    expire_in: 1 week

security:npm:
  stage: security
  needs: []
  script:
    - bash scripts/security/scan.sh npm
  artifacts:
    when: always
    paths: [test-results/security/]
    expire_in: 1 week

image:build:
  stage: build
  needs:
    - job: quality:api
      artifacts: false
    - job: quality:web
      artifacts: false
  tags: [k8s, kaniko]
  image:
    name: "$KANIKO_IMAGE"
    entrypoint: [""]
  script:
    - |
      set -eu
      mkdir -p dist/image
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --destination suuless:ci \
        --no-push --no-push-cache --cache=false \
        --tar-path "$CI_PROJECT_DIR/dist/image/image.tar"
      gzip dist/image/image.tar
  artifacts:
    paths: [dist/image/image.tar.gz]
    expire_in: 1 day

image:scan:
  stage: image
  image: python:3.13-slim-bookworm
  needs:
    - job: image:build
      artifacts: true
  script:
    - python scripts/security/install-tool.py trivy
    - bash scripts/security/scan.sh image dist/image/image.tar.gz
  artifacts:
    when: always
    paths: [test-results/security/]
    expire_in: 1 week

image:publish:
  extends: .release-tag
  stage: image
  interruptible: false
  image: python:3.13-slim-bookworm
  needs:
    - job: image:build
      artifacts: true
    - job: image:scan
      artifacts: false
    - job: quality:api
      artifacts: false
    - job: quality:web
      artifacts: false
    - job: android:build
      artifacts: false
    - job: security
      artifacts: false
    - job: security:npm
      artifacts: false
  script:
    - python scripts/security/install-tool.py crane
    - |
      set -eu
      : "${HARBOR_URL:?HARBOR_URL is required}"
      : "${PROJECT:?PROJECT is required}"
      : "${HARBOR_USER:?HARBOR_USER is required}"
      : "${HARBOR_PASSWORD:?HARBOR_PASSWORD is required}"
      umask 077
      mkdir -p "$DOCKER_CONFIG"
      trap 'rm -f "$DOCKER_CONFIG/config.json"' EXIT
      printf '%s' "$HARBOR_PASSWORD" | .cache/security-bin/crane auth login "$HARBOR_URL" --username "$HARBOR_USER" --password-stdin
      bash scripts/ci/push-scanned-image.sh dist/image/image.tar.gz "${HARBOR_URL}/${PROJECT}/${CI_PROJECT_NAME}:${CI_COMMIT_TAG#v}"
  artifacts:
    reports:
      dotenv: image.env
    paths: [image.env]
    expire_in: 1 week

image:sign:
  extends: .release-tag
  stage: sign
  interruptible: false
  tags: [k8s, kaniko]
  image:
    name: "$KANIKO_COSIGN_IMAGE"
    entrypoint: [""]
  needs:
    - job: image:publish
      artifacts: true
  script:
    - |
      set -eu
      : "${HARBOR_URL:?HARBOR_URL is required}"
      : "${HARBOR_USER:?HARBOR_USER is required}"
      : "${HARBOR_PASSWORD:?HARBOR_PASSWORD is required}"
      : "${COSIGN_PRIVATE_KEY:?COSIGN_PRIVATE_KEY is required}"
      : "${COSIGN_PASSWORD:?COSIGN_PASSWORD is required}"
      : "${SUULESS_IMAGE_REF:?SUULESS_IMAGE_REF is required}"
      umask 077
      mkdir -p "${DOCKER_CONFIG}"
      AUTH="$(printf '%s:%s' "${HARBOR_USER}" "${HARBOR_PASSWORD}" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "${HARBOR_URL}" "${AUTH}" > "${DOCKER_CONFIG}/config.json"
      trap 'rm -f "${DOCKER_CONFIG}/config.json"' EXIT
      if [ -f "${COSIGN_PRIVATE_KEY}" ]; then
        COSIGN_KEY_REFERENCE="${COSIGN_PRIVATE_KEY}"
      else
        COSIGN_KEY="${COSIGN_PRIVATE_KEY}"
        export COSIGN_KEY
        COSIGN_KEY_REFERENCE="env://COSIGN_KEY"
      fi
      cosign sign --key "${COSIGN_KEY_REFERENCE}" -y "${SUULESS_IMAGE_REF}"
      cosign public-key --key "${COSIGN_KEY_REFERENCE}" > cosign.pub
      cosign verify --key cosign.pub "${SUULESS_IMAGE_REF}" > signature-verification.json
  artifacts:
    paths: [cosign.pub, signature-verification.json]
    expire_in: 1 week

release:publish:
  extends: .release-tag
  stage: release
  image: python:3.13-slim-bookworm
  interruptible: false
  resource_group: "release-$CI_COMMIT_TAG"
  needs:
    - job: android:build
      artifacts: true
    - job: image:publish
      artifacts: true
    - job: image:sign
      artifacts: true
  script:
    - python scripts/ci/publish_release.py
