apiVersion: apps/v1
kind: Deployment
metadata:
  name: stop-clop
  namespace: stop-clop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stop-clop
  template:
    metadata:
      labels:
        app: stop-clop
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: stop-clop
        image: registry.example.com/suuless:REPLACE_WITH_VERSION
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: DATABASE
          value: /data/stopclop.db
        - name: ALLOW_REGISTRATION
          value: 'true'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
        volumeMounts:
        - name: data
          mountPath: /data
        - name: temporary
          mountPath: /tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: stop-clop-data
      - name: temporary
        emptyDir:
          sizeLimit: 128Mi
