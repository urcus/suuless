services:
  stop-clop:
    build: .
    image: stop-clop:local
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    volumes:
      - stop-clop-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  stop-clop-data:
