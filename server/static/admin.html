<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuuLess</title><link rel="icon" href="/static/icon.svg"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/portal.css"><script defer src="/static/portal.js"></script><script defer src="/static/admin.js"></script></head><body><header><a class="brand" href="/"><img src="/static/icon.svg" width="40" height="40" alt=""><span data-i18n="app_name">SuuLess</span></a><label><span data-i18n="language">Language</span><select id="portal-language"><option value="en">English</option><option value="fr">Français</option><option value="ja">日本語</option></select></label><button id="portal-logout" data-i18n="logout"></button></header><main id="admin-content" hidden><h1 data-i18n="admin_title"></h1><p data-i18n="admin_intro"></p><nav class="portal-nav"><a href="#users" data-tab="users" data-i18n="admin_users"></a><a href="#invitations" data-tab="invitations" data-i18n="admin_invitations"></a><a href="#smtp" data-tab="smtp" data-i18n="admin_smtp"></a><a href="#profile" data-tab="profile" data-i18n="admin_profile"></a></nav><section id="admin-users" class="panel"><h2 data-i18n="admin_users"></h2><div class="table-scroll"><table><thead><tr><th data-i18n="username"></th><th data-i18n="email"></th><th data-i18n="role"></th><th data-i18n="status"></th><th data-i18n="actions"></th></tr></thead><tbody id="user-list"></tbody></table></div></section><section id="admin-invitations" class="panel" hidden><h2 data-i18n="admin_invitations"></h2><p data-i18n="invitations_note"></p><form id="invite-form"><label><span data-i18n="email"></span><input name="email" type="email" required></label><label><span data-i18n="language"></span><select name="language"><option value="en">English</option><option value="fr">Français</option><option value="ja">日本語</option></select></label><button data-i18n="send_invitation"></button></form><ul id="invitati 18n="password"></span><input name="password" type="password" required maxlength="256" autocomplete="current-password"></label><button data-i18n="verify_email"></button></form></section></main><p id="portal-message" role="status" aria-live="polite"></p></body></html>
