<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuuLess</title><link rel="icon" href="/static/icon.svg"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/portal.css"><script defer src="/static/portal.js"></script><script defer src="/static/account.js"></script></head><body><header><a class="brand" href="/"><img src="/static/icon.svg" width="40" height="40" alt=""><span data-i18n="app_name">SuuLess</span></a><label><span data-i18n="language">Language</span><select id="portal-language"><option value="en">English</option><option value="fr">Français</option><option value="ja">日本語</option></select></label></header><main class="account-portal"><section class="panel"><h1 id="account-heading"></h1><form id="request-form"><label><span data-i18n="email"></span><input name="email" type="email" required autocomplete="email"></label><button data-i18n="request_email"></button></form><form id="complete-form" hidden><div id="invite-fields"><label><span data-i18n="username"></span><input name="username" type="text" pattern="[a-zA-Z0-9_.\-]{3,40}" maxlength="40" autocomplete="username"></label></div><div id="password-fields"><label><span data-i18n="new_password"></span><input name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password"></label><label><span data-i18n="confirm_password"></span><input name="confirm" type="password" minlength="12" maxlength="256" autocomplete="new-password"></label><p data-i18n="password_help"></p></div><button id="complete-submit"></button></form><p id="portal-message" role="status" aria-live="polite"></p><a href="/" data-i18n="back_login"></a></section></main></body></html>
